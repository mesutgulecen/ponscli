name: Feature request
description: Something the CLI should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, not the feature. What the CLI is missing is usually clearer from the thing you could not finish.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: Another tool, a block explorer, a script, or not at all.

  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      multiple: true
      options:
        - pons — the CLI
        - pons-mcp — the MCP server
        - Both
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Please confirm
      description: >-
        Two boundaries are deliberate and will not move. Read them before
        proposing something that depends on either changing.
      options:
        - label: This does not require the MCP server to sign, broadcast, or read a keystore.
          required: true
        - label: This does not require a private key or a password to be passed as a command-line argument.
          required: true
